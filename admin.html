<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>BCC 공장 (관리자) | BCC</title>
<!-- PWA (홈 화면 앱) — 이 페이지를 시작 화면으로 -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BCC 공장" />
<link rel="apple-touch-icon" href="logo.png" />
<script src="pay-config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{--bg:#0a0a0a;--surface:#16161a;--text:#f3f3f5;--text-dim:#9a9aa6;--text-mute:#6c6c78;--gold:#C9A84C;--gold-3:#e6c878;--border:#26262c;
    --font-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ko);line-height:1.6;padding:40px 16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
  .logo img{height:38px;width:auto;background:#fff;border-radius:8px;padding:4px}
  h1{font-size:22px;letter-spacing:-.5px;text-align:center}
  .sub{color:var(--text-dim);font-size:14px;text-align:center;margin-bottom:22px}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:22px;margin-bottom:16px}
  .row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .row label{font-size:13px;color:var(--text-dim)}
  input{width:100%;padding:12px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:10px;font-size:15px;font-family:inherit;line-height:1.6}
  input:focus{outline:none;border-color:var(--gold)}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:var(--gold);color:#1a1407;border:none;border-radius:10px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .status{margin-top:10px;font-size:13px;min-height:18px;text-align:center}
  .status.err{color:#ff8080}.status.ok{color:#5fd38b}
  .forgot{display:block;margin:12px auto 0;padding:2px 4px;border:0;background:none;color:var(--text-dim);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .forgot:hover{color:var(--gold-3)}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;padding:9px;font-size:14px;font-weight:600;background:none;color:var(--text-dim);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-family:inherit}
  .tab.active{color:#1a1407;background:var(--gold);border-color:var(--gold)}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .head .logout{font-size:13px;color:var(--text-dim);background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
  /* 공장 선택 타일 */
  .tool{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 20px;margin-bottom:14px;transition:border-color .15s,transform .05s}
  .tool:active{transform:scale(.99)}
  .tool:hover{border-color:var(--gold)}
  .tool .emoji{font-size:34px;flex:none;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,.12);border-radius:14px}
  .tool .t{font-size:18px;font-weight:800;letter-spacing:-.3px}
  .tool .d{font-size:13px;color:var(--text-dim);margin-top:2px}
  .tool .arrow{margin-left:auto;color:var(--text-mute);font-size:22px;flex:none}
  .hidden{display:none}
  @media(max-width:560px){
    body{padding:max(24px,env(safe-area-inset-top)) 14px 24px}
    input,.btn,.tab{font-size:16px}  /* iOS 입력 시 자동 확대 방지 */
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="logo.png?v=3" alt="BCC" /><strong>BCC 공장</strong></div>

  <!-- 로그인 -->
  <div id="loginView">
    <h1>관리자 로그인</h1>
    <p class="sub">관리자 계정으로만 접근할 수 있습니다.</p>
    <div class="card">
      <div class="tabs">
        <button type="button" class="tab active" data-mode="email">이메일</button>
        <button type="button" class="tab" data-mode="phone">전화번호</button>
      </div>
      <form id="loginForm" novalidate>
        <div class="row" id="rowEmail"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" /></div>
        <div class="row hidden" id="rowPhone"><label for="phone">전화번호</label><input id="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000" /></div>
        <div class="row"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" /></div>
        <button type="submit" class="btn" id="loginBtn">로그인</button>
        <button type="button" class="forgot" id="forgotBtn">비밀번호를 잊으셨나요?</button>
        <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- 공장 선택(허브) -->
  <div id="hubView" class="hidden">
    <div class="head">
      <h1 style="text-align:left;font-size:20px">어떤 공장을 열까요?</h1>
      <button class="logout" id="logoutBtn">로그아웃</button>
    </div>
    <a class="tool" href="admin-threads.html">
      <span class="emoji">✍️</span>
      <span><span class="t">스레드 공장</span><span class="d">스레드 글 자동 생성 (8포맷 + 보관함)</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="tool" href="admin-cardnews.html">
      <span class="emoji">🗂</span>
      <span><span class="t">카드뉴스 공장</span><span class="d">인스타 카드뉴스 자동 생성</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="tool" href="admin-blog.html">
      <span class="emoji">📖</span>
      <span><span class="t">블로그 공장</span><span class="d">정보성 칼럼 자동 생성 (SEO + 보관함)</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="tool" href="admin-proposals.html">
      <span class="emoji">🏛️</span>
      <span><span class="t">기관 제안 운영실</span><span class="d">기관 문의 → 요구분석 → 제안서·커리큘럼 → 후속관리</span></span>
      <span class="arrow">›</span>
    </a>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const API = window.BCC_API_BASE;
  const PHONE_DOMAIN = 'phone.bcc.kr';
  let loginMode = 'email';
  let supabase = null;

  const $ = (id) => document.getElementById(id);
  const setLoginStatus = (m, k) => { $('loginStatus').textContent = m; $('loginStatus').className = 'status' + (k ? ' ' + k : ''); };

  async function getClient() {
    if (supabase) return supabase;
    const c = await fetch(API + '/api/config').then((r) => r.json());
    if (!c.supabaseUrl || !c.supabaseAnonKey) throw new Error('설정을 불러오지 못했습니다.');
    supabase = createClient(c.supabaseUrl, c.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage },
    });
    return supabase;
  }

  function showHub() {
    $('loginView').classList.add('hidden');
    $('hubView').classList.remove('hidden');
  }

  async function requireAdmin(session) {
    if (!session?.access_token) return false;
    const response = await fetch(API + '/api/my-enrollments', {
      headers: { Authorization: 'Bearer ' + session.access_token },
    });
    if (!response.ok) return false;
    const data = await response.json();
    return !!data.profile?.is_admin;
  }

  // 이미 로그인된 세션이 있으면 바로 허브로 (다른 공장 페이지와 세션 공유)
  (async () => {
    try {
      const sb = await getClient();
      const { data: { session } } = await sb.auth.getSession();
      if (await requireAdmin(session)) showHub();
    } catch (e) { /* 로그인 화면 유지 */ }
  })();

  // 로그인 방식 탭 전환
  document.querySelectorAll('#loginView .tab').forEach((t) => t.addEventListener('click', () => {
    loginMode = t.dataset.mode;
    document.querySelectorAll('#loginView .tab').forEach((x) => x.classList.toggle('active', x === t));
    $('rowEmail').classList.toggle('hidden', loginMode !== 'email');
    $('rowPhone').classList.toggle('hidden', loginMode !== 'phone');
    setLoginStatus('');
  }));

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let email;
    if (loginMode === 'phone') {
      const digits = $('phone').value.replace(/\D/g, '');
      if (digits.length < 10) { setLoginStatus('전화번호를 정확히 입력해 주세요.', 'err'); return; }
      email = digits + '@' + PHONE_DOMAIN;
    } else {
      email = $('email').value.trim();
    }
    const pw = $('pw').value;
    if (!email || !pw) { setLoginStatus('로그인 정보를 입력해 주세요.', 'err'); return; }
    $('loginBtn').disabled = true; setLoginStatus('로그인 중…');
    try {
      const sb = await getClient();
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error || !data.session) throw new Error('이메일/전화번호 또는 비밀번호가 올바르지 않습니다.');
      if (!(await requireAdmin(data.session))) {
        await sb.auth.signOut();
        throw new Error('관리자 계정만 사용할 수 있습니다.');
      }
      showHub();
    } catch (err) {
      setLoginStatus(err.message || '로그인에 실패했습니다.', 'err');
      $('loginBtn').disabled = false;
    }
  });

  $('forgotBtn').addEventListener('click', async () => {
    if (loginMode !== 'email') {
      setLoginStatus('이메일 탭에서 관리자 이메일을 입력해 주세요.', 'err');
      return;
    }
    const email = $('email').value.trim();
    if (!email) {
      setLoginStatus('재설정 메일을 받을 이메일을 입력해 주세요.', 'err');
      $('email').focus();
      return;
    }
    $('forgotBtn').disabled = true;
    setLoginStatus('재설정 메일을 보내는 중…');
    try {
      const sb = await getClient();
      const redirectTo = new URL('admin-reset-password.html', location.href).href;
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      setLoginStatus('재설정 메일을 보냈습니다. 60분 안에 링크를 열어 주세요.', 'ok');
    } catch (err) {
      setLoginStatus('재설정 메일을 보내지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
      $('forgotBtn').disabled = false;
    }
  });

  $('logoutBtn').addEventListener('click', async () => {
    try { const sb = await getClient(); await sb.auth.signOut(); } catch (e) {}
    location.reload();
  });
</script>
</body>
</html>
