<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>관리자 비밀번호 재설정 | BCC</title>
<meta name="theme-color" content="#0a0a0a" />
<link rel="apple-touch-icon" href="logo.png" />
<script src="pay-config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{--bg:#0a0a0a;--surface:#16161a;--text:#f3f3f5;--text-dim:#9a9aa6;--gold:#C9A84C;--border:#26262c;--font-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-ko);line-height:1.6;padding:40px 16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
  .logo img{height:38px;width:auto;background:#fff;border-radius:8px;padding:4px}
  h1{font-size:22px;letter-spacing:-.5px;text-align:center}
  .sub{color:var(--text-dim);font-size:14px;text-align:center;margin-bottom:22px}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:22px;margin-bottom:16px}
  .row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .row label{font-size:13px;color:var(--text-dim)}
  input{width:100%;padding:12px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:10px;font-size:15px;font-family:inherit;line-height:1.6}
  input:focus{outline:none;border-color:var(--gold)}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:var(--gold);color:#1a1407;border:none;border-radius:10px;cursor:pointer;text-decoration:none;text-align:center;display:block}
  .btn:disabled{opacity:.55;cursor:default}
  .status{font-size:14px;min-height:22px;text-align:center;color:var(--text-dim)}
  .status.err{color:#ff8080}.status.ok{color:#5fd38b}
  .hidden{display:none}
  @media(max-width:560px){body{padding:max(24px,env(safe-area-inset-top)) 14px 24px}input,.btn{font-size:16px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo"><img src="logo.png?v=3" alt="BCC" /><strong>BCC 공장</strong></div>
  <h1>새 비밀번호 만들기</h1>
  <p class="sub">관리자 계정에 사용할 새 비밀번호를 입력해 주세요.</p>

  <section class="card">
    <p id="checking" class="status" role="status" aria-live="polite">재설정 링크를 확인하고 있습니다…</p>
    <form id="resetForm" class="hidden" novalidate>
      <div class="row">
        <label for="password">새 비밀번호</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" />
      </div>
      <div class="row">
        <label for="confirmPassword">새 비밀번호 확인</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" />
      </div>
      <button type="submit" class="btn" id="resetBtn">비밀번호 변경</button>
      <p id="resetStatus" class="status" role="status" aria-live="polite"></p>
    </form>

    <div id="successView" class="hidden">
      <p class="status ok" style="margin-bottom:14px">비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.</p>
      <a class="btn" href="admin.html">관리자 로그인으로 이동</a>
    </div>
  </section>
</main>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const API = window.BCC_API_BASE;
  const recoveryHint = location.hash.includes('type=recovery') || new URLSearchParams(location.search).has('code');
  const checking = document.getElementById('checking');
  const form = document.getElementById('resetForm');
  const status = document.getElementById('resetStatus');
  const button = document.getElementById('resetBtn');
  let client;
  let recoveryReady = false;

  function showError(message) {
    checking.textContent = message;
    checking.className = 'status err';
  }

  function showForm() {
    if (recoveryReady) return;
    recoveryReady = true;
    checking.classList.add('hidden');
    form.classList.remove('hidden');
    document.getElementById('password').focus();
  }

  async function initialize() {
    try {
      if (!recoveryHint) {
        showError('유효한 재설정 링크가 아닙니다. 관리자 로그인에서 메일을 다시 요청해 주세요.');
        return;
      }
      const config = await fetch(API + '/api/config').then((response) => response.json());
      if (!config.supabaseUrl || !config.supabaseAnonKey) throw new Error('설정을 불러오지 못했습니다.');
      client = createClient(config.supabaseUrl, config.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage },
      });

      client.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) showForm();
      });

      const { data: { session } = {}, error } = await client.auth.getSession();
      if (error) throw error;
      if (session) showForm();
      else setTimeout(async () => {
        const { data: { session: delayedSession } = {} } = await client.auth.getSession();
        if (delayedSession) showForm();
        else showError('재설정 링크가 만료되었거나 이미 사용되었습니다. 메일을 다시 요청해 주세요.');
      }, 1800);
    } catch (error) {
      showError('재설정 링크를 확인하지 못했습니다. 관리자 로그인에서 메일을 다시 요청해 주세요.');
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    status.className = 'status';
    if (password.length < 8) {
      status.textContent = '비밀번호는 8자 이상으로 입력해 주세요.';
      status.classList.add('err');
      return;
    }
    if (password !== confirmPassword) {
      status.textContent = '두 비밀번호가 서로 다릅니다.';
      status.classList.add('err');
      return;
    }
    button.disabled = true;
    status.textContent = '비밀번호를 변경하는 중…';
    try {
      const { error } = await client.auth.updateUser({ password });
      if (error) throw error;
      await client.auth.signOut();
      history.replaceState(null, '', location.pathname);
      form.classList.add('hidden');
      document.getElementById('successView').classList.remove('hidden');
    } catch (error) {
      status.textContent = '비밀번호를 변경하지 못했습니다. 링크를 다시 요청해 주세요.';
      status.classList.add('err');
      button.disabled = false;
    }
  });

  initialize();
</script>
</body>
</html>
