<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>마이페이지 | BCC</title>
<script src="pay-config.js"></script>
<style>
  :root{--bg:#0a0a0a;--text:#f3f3f5;--text-dim:#9a9aa6;--text-mute:#6c6c78;--gold:#C9A84C;--gold-3:#e6c878;--border:#26262c;
    --font-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ko);line-height:1.6;padding:40px 16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:24px}
  .logo img{height:38px;width:auto;background:#fff;border-radius:8px;padding:4px}
  h1{font-size:22px;letter-spacing:-.5px;margin-bottom:6px;text-align:center}
  .sub{color:var(--text-dim);font-size:14px;text-align:center;margin-bottom:24px}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:22px}
  .row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .row label{font-size:13px;color:var(--text-dim)}
  input{width:100%;padding:12px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:10px;font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--gold)}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:var(--gold);color:#1a1407;border:none;border-radius:10px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .status{margin-top:10px;font-size:13px;min-height:18px;text-align:center}
  .status.err{color:#ff8080}.status.ok{color:#5fd38b}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .head .name{font-weight:700}
  .head .logout{font-size:13px;color:var(--text-dim);background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;padding:9px;font-size:14px;font-weight:600;background:none;color:var(--text-dim);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-family:inherit}
  .tab.active{color:#1a1407;background:var(--gold);border-color:var(--gold)}
  .enr{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .enr .t{font-weight:600;display:flex;justify-content:space-between}
  .enr .m{font-size:12px;color:var(--text-mute);margin-top:4px}
  .badge{font-size:11px;color:var(--gold-3);border:1px solid rgba(201,168,76,.4);border-radius:999px;padding:1px 8px;margin-left:6px}
  .empty{color:var(--text-dim);font-size:14px;text-align:center;padding:18px 0}
  .adminlink{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:15px;background:var(--gold);color:#1a1407;border-radius:10px;padding:13px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="logo.png?v=3" alt="BCC" /><strong>BCC</strong></div>

  <!-- 로그인 -->
  <div id="loginView">
    <h1>마이페이지 로그인</h1>
    <p class="sub">결제 후 설정한 이메일, 또는 기존 수강생은 전화번호로 로그인하세요.</p>
    <div class="card">
      <div class="tabs">
        <button type="button" class="tab active" data-mode="email">이메일</button>
        <button type="button" class="tab" data-mode="phone">전화번호</button>
      </div>
      <form id="loginForm" novalidate>
        <div class="row" id="rowEmail"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" /></div>
        <div class="row" id="rowPhone" style="display:none"><label for="phone">전화번호</label><input id="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000" /></div>
        <div class="row"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" /></div>
        <button type="submit" class="btn" id="loginBtn">로그인</button>
        <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
      </form>
    </div>
    <p class="sub" style="margin-top:16px">아직 회원이 아니신가요? <a href="signup.html" style="color:var(--gold-3)">회원가입</a></p>
  </div>

  <!-- 수강이력 -->
  <div id="dashView" style="display:none">
    <div class="card">
      <div class="head">
        <span class="name" id="userName"></span>
        <button class="logout" id="logoutBtn">로그아웃</button>
      </div>
      <a id="adminLink" href="admin-cardnews.html" class="adminlink" style="display:none">🛠 카드뉴스 공장 열기</a>
      <a id="threadsLink" href="admin-threads.html" class="adminlink" style="display:none">✍️ 스레드 공장 열기</a>
      <div id="enrList"></div>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const API = window.BCC_API_BASE;
  const PHONE_DOMAIN = 'phone.bcc.kr';   // 전화 로그인 합성 이메일 도메인(seed 스크립트와 동일)
  let loginMode = 'email';               // 'email' | 'phone'
  const loginView = document.getElementById('loginView');
  const dashView = document.getElementById('dashView');
  const loginStatus = document.getElementById('loginStatus');
  let supabase = null;

  const won = (n) => Number(n).toLocaleString('ko-KR') + '원';
  const fmtDate = (s) => { try { return new Date(s).toLocaleDateString('ko-KR'); } catch(e){ return s; } };
  const setStatus = (m,k) => { loginStatus.textContent = m; loginStatus.className = 'status' + (k?' '+k:''); };

  async function getClient(){
    if (supabase) return supabase;
    const c = await fetch(API + '/api/config').then(r => r.json());
    if (!c.supabaseUrl || !c.supabaseAnonKey) throw new Error('설정을 불러오지 못했습니다.');
    supabase = createClient(c.supabaseUrl, c.supabaseAnonKey);
    return supabase;
  }

  async function loadDashboard(token){
    const res = await fetch(API + '/api/my-enrollments', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '조회 실패');

    document.getElementById('userName').textContent = (data.profile?.name || '회원') + ' 님';
    // 관리자(is_admin)에게만 카드뉴스 공장 진입 버튼 노출
    if (data.profile?.is_admin) {
      document.getElementById('adminLink').style.display = 'block';
      document.getElementById('threadsLink').style.display = 'block';
    }
    const list = data.enrollments || [];
    const box = document.getElementById('enrList');
    if (!list.length) { box.innerHTML = '<div class="empty">아직 수강 이력이 없습니다.</div>'; }
    else {
      box.innerHTML = list.map(e =>
        '<div class="enr"><div class="t"><span>' + (e.products?.name || e.product_id) +
        (e.is_recourse ? '<span class="badge">재수강</span>' : '') + '</span><span>' + won(e.paid_amount) + '</span></div>' +
        '<div class="m">결제일 ' + fmtDate(e.paid_at) + '</div></div>'
      ).join('');
    }
    loginView.style.display = 'none';
    dashView.style.display = 'block';
  }

  // 이미 로그인된 세션이 있으면 바로 대시보드
  (async () => {
    try {
      const sb = await getClient();
      const { data: { session } } = await sb.auth.getSession();
      if (session?.access_token) await loadDashboard(session.access_token);
    } catch(e){ /* 로그인 화면 유지 */ }
  })();

  // 로그인 방식 탭(이메일 / 전화번호) 전환
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    loginMode = t.dataset.mode;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.getElementById('rowEmail').style.display = loginMode === 'email' ? '' : 'none';
    document.getElementById('rowPhone').style.display = loginMode === 'phone' ? '' : 'none';
    setStatus('');
  }));

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    // 전화번호 로그인은 전화번호(숫자만)를 합성 이메일로 변환해 동일 Auth 경로로 처리
    let email;
    if (loginMode === 'phone') {
      const digits = document.getElementById('phone').value.replace(/\D/g, '');
      if (digits.length < 10) { setStatus('전화번호를 정확히 입력해 주세요.', 'err'); return; }
      email = digits + '@' + PHONE_DOMAIN;
    } else {
      email = document.getElementById('email').value.trim();
    }
    const pw = document.getElementById('pw').value;
    const btn = document.getElementById('loginBtn');
    if (!email || !pw) { setStatus('로그인 정보를 입력해 주세요.', 'err'); return; }

    btn.disabled = true; setStatus('로그인 중…');
    try {
      const sb = await getClient();
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error || !data.session) throw new Error(loginMode === 'phone'
        ? '전화번호 또는 비밀번호가 올바르지 않습니다. (초기 비밀번호는 전화번호 숫자입니다)'
        : '이메일 또는 비밀번호가 올바르지 않습니다. (비밀번호 미설정 시 결제 완료 화면에서 먼저 설정하세요)');
      await loadDashboard(data.session.access_token);
    } catch(err){
      setStatus(err.message || '로그인에 실패했습니다.', 'err');
      btn.disabled = false;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { const sb = await getClient(); await sb.auth.signOut(); } catch(e){}
    location.reload();
  });
</script>
</body>
</html>
