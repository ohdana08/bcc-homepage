<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>결제 실패 | BCC</title>
<style>
  :root{--bg:#0a0a0a;--text:#f3f3f5;--text-dim:#9a9aa6;--gold:#C9A84C;--border:#26262c;
    --font-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ko);line-height:1.6;padding:48px 16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;text-align:center}
  .icon{width:64px;height:64px;border-radius:50%;background:rgba(255,128,128,.12);color:#ff8080;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 20px}
  h1{font-size:24px;letter-spacing:-.5px;margin-bottom:8px}
  .sub{color:var(--text-dim);font-size:14px;margin-bottom:24px}
  .card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--text-dim);margin-bottom:22px}
  .btn{display:inline-block;padding:13px 22px;font-size:15px;font-weight:700;background:var(--gold);color:#1a1407;border:none;border-radius:10px;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">!</div>
  <h1>결제가 완료되지 않았습니다</h1>
  <p class="sub">결제가 취소되었거나 도중에 중단되었습니다.<br>다시 시도해 주세요.</p>
  <div class="card" id="reason"></div>
  <a class="btn" href="apply.html">다시 신청하기</a>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var msg = q.get('message');
  var code = q.get('code');
  if(msg || code){
    document.getElementById('reason').textContent = '사유: ' + (msg || '') + (code ? ' ('+code+')' : '');
  } else {
    document.getElementById('reason').style.display = 'none';
  }
</script>
</body>
</html>
