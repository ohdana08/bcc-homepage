<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>신청·결제 | BCC 비즈니스커리어컨설팅</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5TN5XW0T2J"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-5TN5XW0T2J');
</script>

<script src="https://js.tosspayments.com/v2/standard"></script>
<script src="pay-config.js"></script>

<style>
  :root{
    --bg:#0a0a0a; --surface:#16161a; --border:#26262c;
    --text:#f3f3f5; --text-dim:#9a9aa6; --text-mute:#6c6c78;
    --gold:#C9A84C; --gold-3:#e6c878;
    --font-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ko);line-height:1.6;-webkit-font-smoothing:antialiased;padding:32px 16px}
  .wrap{max-width:520px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:24px}
  .logo img{height:40px;width:auto;background:#fff;border-radius:8px;padding:4px}
  h1{font-size:24px;letter-spacing:-.5px;margin-bottom:6px;text-align:center}
  .sub{color:var(--text-dim);font-size:14px;text-align:center;margin-bottom:24px}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:24px}
  .prod-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .prod{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
  .prod:hover{border-color:var(--gold)}
  .prod.sel{border-color:var(--gold);background:rgba(201,168,76,.08)}
  .prod input{accent-color:var(--gold);margin-right:10px}
  .prod-name{font-weight:600}
  .prod-price{color:var(--gold-3);font-weight:700}
  .prod-price small{color:var(--text-mute);font-weight:400;display:block;font-size:11px}
  .row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .row label{font-size:13px;color:var(--text-dim)}
  .req{color:var(--gold)}
  input[type=text],input[type=email],input[type=tel]{width:100%;padding:12px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:10px;font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--gold)}
  .agree{display:flex;flex-direction:column;gap:8px;margin:6px 0 18px}
  .consent{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-dim);cursor:pointer}
  .consent input{margin-top:3px;accent-color:var(--gold)}
  .consent a{color:var(--gold);text-decoration:underline}
  .consent .req{color:var(--gold);font-weight:700}
  .consent .opt{color:var(--text-mute);font-weight:700}
  .consent small{color:var(--text-mute)}
  .view{margin-left:4px;white-space:nowrap;font-size:12px;cursor:pointer}
  /* 모달 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.open{display:flex}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;max-height:80vh;display:flex;flex-direction:column}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
  .modal-head h2{font-size:16px;margin:0}
  .modal-close{background:none;border:none;color:var(--text-dim);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
  .modal-body{padding:18px 20px;overflow-y:auto;font-size:13px;line-height:1.7;color:var(--text-dim)}
  .modal-body h3{font-size:14px;color:var(--text);margin:16px 0 6px}
  .modal-body h3:first-child{margin-top:0}
  .modal-body ul{padding-left:18px;margin:4px 0}
  .modal-body li{margin:2px 0}
  .modal-body .sub{color:var(--text-mute);font-size:12px}
  .submit{width:100%;padding:14px;font-size:16px;font-weight:700;background:var(--gold);color:#1a1407;border:none;border-radius:10px;cursor:pointer}
  .submit:disabled{opacity:.55;cursor:default}
  .status{margin-top:12px;font-size:13px;min-height:18px;text-align:center}
  .status.err{color:#ff8080}
  .status.ok{color:#5fd38b}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .note{font-size:12px;color:var(--text-mute);margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <img src="logo.png?v=3" alt="BCC" />
    <strong>BCC</strong>
  </div>
  <h1>챌린지 신청</h1>
  <p class="sub">3칸만 입력하면 바로 결제로 이어집니다.</p>

  <div class="card">
    <form id="applyForm" novalidate>
      <div class="prod-list" id="prodList">
        <div class="status" style="text-align:left">상품을 불러오는 중…</div>
      </div>

      <div class="row">
        <label for="name">이름 <span class="req">*</span></label>
        <input id="name" name="name" type="text" maxlength="50" required autocomplete="name" />
      </div>
      <div class="row">
        <label for="phone">전화번호 <span class="req">*</span></label>
        <input id="phone" name="phone" type="tel" maxlength="20" required placeholder="010-0000-0000" autocomplete="tel" />
      </div>
      <div class="row">
        <label for="email">이메일 <span class="req">*</span></label>
        <input id="email" name="email" type="email" maxlength="100" required placeholder="결제·계정 안내가 갑니다" autocomplete="email" />
      </div>

      <!-- 허니팟 -->
      <div class="hp" aria-hidden="true">
        <label>웹사이트<input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
      </div>

      <div class="agree">
        <label class="consent">
          <input id="agreePrivacy" type="checkbox" />
          <span><b class="req">[필수]</b> 개인정보 수집·이용에 동의합니다.
            <a href="#" class="view" data-doc="privacy">[전문 보기]</a></span>
        </label>
        <label class="consent">
          <input id="agreeTerms" type="checkbox" />
          <span><b class="req">[필수]</b> 이용약관에 동의합니다.
            <a href="#" class="view" data-doc="terms">[전문 보기]</a></span>
        </label>
        <label class="consent">
          <input id="agreeMarketing" type="checkbox" />
          <span><span class="opt">[선택]</span> 마케팅 정보 수신에 동의합니다. <small>(이메일/카카오 알림)</small></span>
        </label>
      </div>

      <button type="submit" class="submit" id="submitBtn" disabled>결제하기</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="note">이전에 BCC 강의를 구매한 적이 있으면 <b>재수강가</b>가 자동 적용됩니다.</p>
  </div>
</div>

<!-- 동의 전문 모달 -->
<div class="modal" id="docModal" role="dialog" aria-modal="true" aria-labelledby="docTitle">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="docTitle"></h2>
      <button type="button" class="modal-close" id="docClose" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body" id="docBody"></div>
  </div>
</div>

<script>
(function(){
  var API = window.BCC_API_BASE;
  var form = document.getElementById('applyForm');
  var statusEl = document.getElementById('status');
  var prodListEl = document.getElementById('prodList');
  var btn = document.getElementById('submitBtn');
  var selectedProduct = null;
  var tossClientKey = null;

  var agreePrivacy = document.getElementById('agreePrivacy');
  var agreeTerms = document.getElementById('agreeTerms');
  var agreeMarketing = document.getElementById('agreeMarketing');

  // 필수 2개 모두 체크해야 결제 버튼 활성화
  function updateBtn(){ btn.disabled = !(agreePrivacy.checked && agreeTerms.checked); }
  agreePrivacy.addEventListener('change', updateBtn);
  agreeTerms.addEventListener('change', updateBtn);
  updateBtn();

  // 동의 전문 모달
  var DOCS = {
    privacy: {
      title: '개인정보 수집·이용 동의',
      body:
        '<p>비즈니스커리어컨설팅(이하 "회사")은 회원가입 및 서비스 제공을 위해 아래와 같이 개인정보를 수집·이용합니다.</p>'+
        '<h3>1. 수집 항목</h3>'+
        '<ul><li>필수: 이름, 휴대전화번호, 이메일 주소, 비밀번호</li>'+
        '<li>결제 시: 결제 승인 정보(결제수단·승인번호·결제금액)<br><span class="sub">※ 카드번호 등 민감 결제정보는 회사가 저장하지 않으며, 결제대행사(토스페이먼츠)가 처리합니다.</span></li></ul>'+
        '<h3>2. 수집·이용 목적</h3>'+
        '<ul><li>회원 식별 및 본인 확인</li><li>강의·콘텐츠 등 유료 서비스 제공 및 수강 관리</li>'+
        '<li>결제·환불 처리 및 거래 내역 관리</li><li>공지사항 전달 및 고객 문의 응대</li></ul>'+
        '<h3>3. 보유·이용 기간</h3>'+
        '<ul><li>회원 탈퇴 시 즉시 파기.</li>'+
        '<li>단, 관계 법령에 따라 아래는 정해진 기간 보관:<ul>'+
        '<li>계약·청약철회·대금결제 기록: 5년 (전자상거래법)</li>'+
        '<li>소비자 불만·분쟁처리 기록: 3년 (전자상거래법)</li>'+
        '<li>표시·광고 기록: 6개월 (전자상거래법)</li></ul></li></ul>'+
        '<h3>4. 동의 거부 권리</h3>'+
        '<p>귀하는 동의를 거부할 수 있으나, 필수 항목 미동의 시 회원가입 및 서비스 이용이 제한됩니다.</p>'
    },
    terms: {
      title: '이용약관',
      body:
        '<p class="sub">[ 이용약관 전문은 준비 중입니다. 확정 시 이 자리에 게시됩니다. ]</p>'+
        '<p>전체 개인정보처리방침은 <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a> 페이지에서 확인하실 수 있습니다.</p>'
    }
  };
  var modal = document.getElementById('docModal');
  var docTitle = document.getElementById('docTitle');
  var docBody = document.getElementById('docBody');
  function openDoc(key){ var d = DOCS[key]; if(!d) return; docTitle.textContent = d.title; docBody.innerHTML = d.body; modal.classList.add('open'); }
  function closeDoc(){ modal.classList.remove('open'); }
  [].forEach.call(document.querySelectorAll('.view'), function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); openDoc(a.getAttribute('data-doc')); });
  });
  document.getElementById('docClose').addEventListener('click', closeDoc);
  modal.addEventListener('click', function(e){ if(e.target === modal) closeDoc(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDoc(); });

  function setStatus(msg, kind){ statusEl.textContent = msg; statusEl.className = 'status' + (kind ? ' '+kind : ''); }
  function won(n){ return n.toLocaleString('ko-KR') + '원'; }
  function track(name, params){ try{ if(typeof gtag==='function') gtag('event', name, params||{}); }catch(e){} }
  function preselect(){ return new URLSearchParams(location.search).get('product'); }

  // 공개 설정(토스 client key) 로드
  fetch(API + '/api/config').then(function(r){return r.json();}).then(function(c){
    tossClientKey = c.tossClientKey || null;
  }).catch(function(){});

  // 상품 목록 로드
  fetch(API + '/api/products').then(function(r){return r.json();}).then(function(d){
    var list = (d && d.products) || [];
    if(!list.length){ prodListEl.innerHTML = '<div class="status err">판매 중인 상품이 없습니다.</div>'; return; }
    var want = preselect();
    prodListEl.innerHTML = '';
    list.forEach(function(p, i){
      var el = document.createElement('label');
      el.className = 'prod';
      var rc = p.recourse_price ? '<small>재수강가 ' + won(p.recourse_price) + '</small>' : '';
      el.innerHTML =
        '<span class="prod-name"><input type="radio" name="product" value="'+p.id+'">'+p.name+'</span>'+
        '<span class="prod-price">'+won(p.price)+rc+'</span>';
      prodListEl.appendChild(el);
      var radio = el.querySelector('input');
      radio.addEventListener('change', function(){
        selectedProduct = p.id;
        [].forEach.call(prodListEl.querySelectorAll('.prod'), function(x){x.classList.remove('sel');});
        el.classList.add('sel');
      });
      if((want && want===p.id) || (!want && i===0)){ radio.checked = true; radio.dispatchEvent(new Event('change')); }
    });
  }).catch(function(){ prodListEl.innerHTML = '<div class="status err">상품을 불러오지 못했습니다.</div>'; });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = form.name.value.trim();
    var phone = form.phone.value.trim();
    var email = form.email.value.trim();

    if(!selectedProduct){ setStatus('상품을 선택해 주세요.', 'err'); return; }
    if(!name || !phone || !email){ setStatus('이름·전화번호·이메일을 모두 입력해 주세요.', 'err'); return; }
    if(!(agreePrivacy.checked && agreeTerms.checked)){ setStatus('필수 동의 항목에 모두 체크해 주세요.', 'err'); return; }
    if(!tossClientKey){ setStatus('결제 설정을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.', 'err'); return; }

    btn.disabled = true; setStatus('주문을 준비하는 중…');
    track('apply_click', { product_id: selectedProduct });

    fetch(API + '/api/create-checkout', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name:name, phone:phone, email:email, productId:selectedProduct, website: form.website.value, marketingConsent: agreeMarketing.checked })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(!res.ok){ throw new Error(res.j && res.j.error || '주문 생성 실패'); }
      var o = res.j;
      track('begin_checkout', { product_name:o.orderName, value:o.amount, currency:'KRW', is_recourse:o.isRecourse });

      var toss = TossPayments(tossClientKey);
      var payment = toss.payment({ customerKey: o.customerKey });
      var successUrl = new URL('success.html', location.href).href;
      var failUrl = new URL('fail.html', location.href).href;
      return payment.requestPayment({
        method:'CARD',
        amount:{ currency:'KRW', value:o.amount },
        orderId:o.orderId,
        orderName:o.orderName,
        successUrl:successUrl,
        failUrl:failUrl,
        customerName:o.customerName,
        customerEmail:o.customerEmail
      });
    }).catch(function(err){
      setStatus((err && err.message) ? err.message : '결제를 시작하지 못했습니다.', 'err');
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
