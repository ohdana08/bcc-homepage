name: Threads autopilot

on:
  schedule:
    # Start away from the top of the hour, then poll through each publish or
    # six-hour follow-up window. GitHub documents that scheduled runs can be
    # delayed or dropped during high-load periods, especially on the hour.
    - cron: '10 0,3,8,11,14,17,18,20,21 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      poll_window:
        description: 'Poll for the full 46-minute window'
        required: false
        default: false
        type: boolean

concurrency:
  group: threads-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Poll Threads worker through the active window
        env:
          CRON_SECRET: ${{ secrets.THREADS_CRON_SECRET }}
          RUN_WINDOW: ${{ github.event_name == 'schedule' || inputs.poll_window == true }}
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          attempts=1
          if [ "$RUN_WINDOW" = "true" ]; then
            attempts=46
          fi

          failures=0
          for attempt in $(seq 1 "$attempts"); do
            if ! curl --fail --silent --show-error \
              --retry 1 --retry-all-errors \
              --max-time 45 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://bcc-homepage.vercel.app/api/cleanup-pending?job=threads"; then
              failures=$((failures + 1))
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              sleep 60
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo "${failures} Threads worker call(s) failed" >&2
            exit 1
          fi
