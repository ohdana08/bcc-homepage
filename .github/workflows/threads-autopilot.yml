name: Threads autopilot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: threads-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Threads worker
        env:
          CRON_SECRET: ${{ secrets.THREADS_CRON_SECRET }}
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://bcc-homepage.vercel.app/api/cleanup-pending?job=threads"
