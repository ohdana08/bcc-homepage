name: Threads autopilot

on:
  schedule:
    # GitHub's five-minute cron is best-effort and was observed skipping slots.
    # Four overlapping six-hour polling windows keep the worker active every minute.
    # UTC 02:55/08:55/14:55/20:55 = KST 11:55/17:55/23:55/05:55.
    - cron: '55 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Run one campaign or all campaigns'
        required: false
        default: all
        type: choice
        options:
          - all
          - default
          - jiwonfit
          - unsent_talk
      verify_only:
        description: 'Verify the selected campaign token/account without publishing'
        required: false
        default: false
        type: boolean
      verify_search_only:
        description: 'Verify keyword_search permission without publishing or commenting'
        required: false
        default: false
        type: boolean
      poll_window:
        description: 'Poll for a four-hour recovery window'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.verify_only == true || inputs.verify_search_only == true) && 'threads-autopilot-verify' || 'threads-autopilot' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Poll Threads worker through the active window
        env:
          CRON_SECRET: ${{ secrets.THREADS_CRON_SECRET }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
          MANUAL_WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.poll_window == true }}
          MANUAL_CAMPAIGN: ${{ inputs.campaign || 'all' }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true }}
          VERIFY_SEARCH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_search_only == true }}
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          if [ "$VERIFY_ONLY" = "true" ]; then
            if [ "$MANUAL_CAMPAIGN" = "all" ]; then
              echo "verify_only requires one campaign" >&2
              exit 1
            fi
            curl --fail-with-body --silent --show-error \
              --max-time 295 \
              --write-out '\n' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://bcc-homepage.vercel.app/api/cleanup-pending?job=threads&campaign=${MANUAL_CAMPAIGN}&verify_only=true"
            exit 0
          fi

          if [ "$VERIFY_SEARCH_ONLY" = "true" ]; then
            if [ "$MANUAL_CAMPAIGN" = "all" ]; then
              echo "verify_search_only requires one campaign" >&2
              exit 1
            fi
            curl --fail-with-body --silent --show-error \
              --max-time 295 \
              --write-out '\n' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://bcc-homepage.vercel.app/api/cleanup-pending?job=threads&campaign=${MANUAL_CAMPAIGN}&verify_search_only=true"
            exit 0
          fi

          window_seconds=0
          if [ "$SCHEDULED_RUN" = "true" ]; then
            window_seconds=21300
          elif [ "$MANUAL_WINDOW" = "true" ]; then
            window_seconds=14400
          fi

          deadline=$((SECONDS + window_seconds))
          failures=0
          attempt=1
          campaigns="default jiwonfit unsent_talk"
          if [ "$MANUAL_CAMPAIGN" != "all" ]; then
            campaigns="$MANUAL_CAMPAIGN"
          fi
          while true; do
            for campaign in $campaigns; do
              echo "Threads worker attempt ${attempt}: ${campaign}"
              if ! curl --fail --silent --show-error \
                --max-time 295 \
                --write-out '\n' \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "https://bcc-homepage.vercel.app/api/cleanup-pending?job=threads&campaign=${campaign}"; then
                failures=$((failures + 1))
              fi
            done

            if [ "$window_seconds" -eq 0 ] || [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi

            remaining=$((deadline - SECONDS))
            sleep_seconds=60
            if [ "$remaining" -lt "$sleep_seconds" ]; then
              sleep_seconds="$remaining"
            fi
            if [ "$sleep_seconds" -le 0 ]; then
              break
            fi

            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

          if [ "$failures" -gt 0 ]; then
            echo "${failures} Threads worker call(s) failed" >&2
            exit 1
          fi
