<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>회원가입 | BCC</title>
<!-- Google tag (gtag.js) — 사이트 전체와 동일 측정 ID -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5TN5XW0T2J"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-5TN5XW0T2J');
</script>
<script src="pay-config.js"></script>
<style>
  :root{--bg:#0a0a0a;--text:#f3f3f5;--text-dim:#9a9aa6;--text-mute:#6c6c78;--gold:#C9A84C;--gold-3:#e6c878;--border:#26262c;
    --font-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ko);line-height:1.6;padding:40px 16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:24px}
  .logo img{height:38px;width:auto;background:#fff;border-radius:8px;padding:4px}
  h1{font-size:22px;letter-spacing:-.5px;margin-bottom:6px;text-align:center}
  .sub{color:var(--text-dim);font-size:14px;text-align:center;margin-bottom:24px}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:22px}
  .row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .row label{font-size:13px;color:var(--text-dim)}
  input{width:100%;padding:12px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:10px;font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--gold)}
  .hint{font-size:12px;color:var(--text-mute)}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:var(--gold);color:#1a1407;border:none;border-radius:10px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .status{margin-top:10px;font-size:13px;min-height:18px;text-align:center}
  .status.err{color:#ff8080}.status.ok{color:#5fd38b}
  .agree{margin:6px 0 16px;display:flex;flex-direction:column;gap:10px}
  .consent{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-dim);cursor:pointer}
  .consent input{width:auto;margin-top:3px;accent-color:var(--gold)}
  .consent a{color:var(--gold);text-decoration:underline}
  .consent .req{color:var(--gold);font-weight:700}
  .consent .opt{color:var(--text-mute);font-weight:700}
  .consent small{color:var(--text-mute)}
  .foot{text-align:center;margin-top:16px;font-size:13px;color:var(--text-dim)}
  .foot a{color:var(--gold-3)}
  /* honeypot */
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  /* modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;padding:24px;overflow-y:auto}
  .modal.open{display:flex;align-items:flex-start;justify-content:center}
  .modal-box{background:#15151a;border:1px solid var(--border);border-radius:14px;max-width:520px;width:100%;margin:auto}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
  .modal-head h2{font-size:16px}
  .modal-close{background:none;border:none;color:var(--text-dim);font-size:24px;cursor:pointer;line-height:1}
  .modal-body{padding:18px 20px;font-size:13px;color:var(--text-dim);max-height:60vh;overflow-y:auto}
  .modal-body h3{font-size:14px;color:var(--text);margin:14px 0 6px}
  .modal-body ul{padding-left:18px;margin:4px 0}
  .modal-body .sub{color:var(--text-mute);font-size:12px}
  .modal-body a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="logo.png?v=3" alt="BCC" /><strong>BCC</strong></div>

  <h1>회원가입</h1>
  <p class="sub">가입 후 마이페이지에서 수강 이력을 확인할 수 있습니다.</p>

  <div class="card">
    <form id="signupForm" novalidate>
      <!-- 허니팟 -->
      <div class="hp" aria-hidden="true">
        <label>웹사이트<input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
      </div>

      <div class="row"><label for="name">이름</label><input id="name" type="text" autocomplete="name" /></div>
      <div class="row"><label for="phone">전화번호</label><input id="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000" /></div>
      <div class="row"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" /></div>
      <div class="row">
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" autocomplete="new-password" />
        <span class="hint">8자 이상. 로그인할 때 사용합니다.</span>
      </div>
      <div class="row"><label for="pw2">비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password" /></div>

      <div class="agree">
        <label class="consent">
          <input id="agreePrivacy" type="checkbox" />
          <span><b class="req">[필수]</b> 개인정보 수집·이용에 동의합니다.
            <a href="#" class="view" data-doc="privacy">[전문 보기]</a></span>
        </label>
        <label class="consent">
          <input id="agreeInfo" type="checkbox" />
          <span><span class="opt">[선택]</span> 신규 강의·특강·이벤트·무료 자료 안내를 받겠습니다.</span>
        </label>
        <p style="font-size:12px;color:var(--text-mute);margin:0">※ 본 서비스는 만 14세 이상만 가입할 수 있습니다.</p>
      </div>

      <button type="submit" class="btn" id="signupBtn" disabled>회원가입</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <p class="foot">이미 계정이 있으신가요? <a href="mypage.html">로그인</a></p>
</div>

<!-- 동의 전문 모달 -->
<div class="modal" id="docModal" role="dialog" aria-modal="true" aria-labelledby="docTitle">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="docTitle"></h2>
      <button type="button" class="modal-close" id="docClose" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body" id="docBody"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const API = window.BCC_API_BASE;
  const form = document.getElementById('signupForm');
  const btn = document.getElementById('signupBtn');
  const statusEl = document.getElementById('status');
  const agreePrivacy = document.getElementById('agreePrivacy');
  const agreeInfo = document.getElementById('agreeInfo'); // 선택 동의(법적으로는 마케팅 수신 동의)
  const setStatus = (m,k) => { statusEl.textContent = m; statusEl.className = 'status' + (k?' '+k:''); };

  // 필수(개인정보)에 체크해야 버튼 활성화
  const updateBtn = () => { btn.disabled = !agreePrivacy.checked; };
  agreePrivacy.addEventListener('change', updateBtn);
  updateBtn();

  // 동의 전문 모달 (apply.html 과 동일 문구)
  const DOCS = {
    privacy: {
      title: '개인정보 수집·이용 동의',
      body:
        '<p>비즈니스커리어컨설팅(이하 "회사")은 회원가입 및 서비스 제공을 위해 아래와 같이 개인정보를 수집·이용합니다.</p>'+
        '<h3>1. 수집 항목</h3>'+
        '<ul><li>필수: 이름, 휴대전화번호, 이메일 주소, 비밀번호</li>'+
        '<li>결제 시: 결제 승인 정보(결제수단·승인번호·결제금액)<br><span class="sub">※ 카드번호 등 민감 결제정보는 회사가 저장하지 않으며, 결제대행사(토스페이먼츠)가 처리합니다.</span></li></ul>'+
        '<h3>2. 수집·이용 목적</h3>'+
        '<ul><li>회원 식별 및 본인 확인</li><li>강의·콘텐츠 등 유료 서비스 제공 및 수강 관리</li>'+
        '<li>결제·환불 처리 및 거래 내역 관리</li><li>공지사항 전달 및 고객 문의 응대</li></ul>'+
        '<h3>3. 보유·이용 기간</h3>'+
        '<ul><li>회원 탈퇴 시 즉시 파기.</li>'+
        '<li>단, 관계 법령에 따라 아래는 정해진 기간 보관:<ul>'+
        '<li>계약·청약철회·대금결제 기록: 5년 (전자상거래법)</li>'+
        '<li>소비자 불만·분쟁처리 기록: 3년 (전자상거래법)</li>'+
        '<li>표시·광고 기록: 6개월 (전자상거래법)</li></ul></li></ul>'+
        '<h3>4. 동의 거부 권리</h3>'+
        '<p>귀하는 동의를 거부할 수 있으나, 필수 항목 미동의 시 회원가입 및 서비스 이용이 제한됩니다.</p>'+
        '<p class="sub" style="margin-top:14px">위탁·국외이전 등 개인정보 처리에 관한 자세한 사항은 <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>을 확인하실 수 있습니다.</p>'
    }
  };
  const modal = document.getElementById('docModal');
  document.querySelectorAll('.view').forEach(a => a.addEventListener('click', (e) => {
    e.preventDefault();
    const doc = DOCS[a.dataset.doc];
    if (!doc) return;
    document.getElementById('docTitle').textContent = doc.title;
    document.getElementById('docBody').innerHTML = doc.body;
    modal.classList.add('open');
  }));
  document.getElementById('docClose').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    const website = form.querySelector('input[name="website"]').value;

    if (!name || !phone || !email) { setStatus('이름·전화번호·이메일을 모두 입력해 주세요.', 'err'); return; }
    if (pw.length < 8) { setStatus('비밀번호는 8자 이상이어야 합니다.', 'err'); return; }
    if (pw !== pw2) { setStatus('비밀번호가 일치하지 않습니다.', 'err'); return; }
    if (!agreePrivacy.checked) { setStatus('개인정보 수집·이용에 동의해 주세요.', 'err'); return; }

    btn.disabled = true; setStatus('가입 중…');
    try {
      const res = await fetch(API + '/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name, phone, email, password: pw,
          privacyConsent: true,
          marketingConsent: agreeInfo.checked, // 화면엔 "마케팅" 미노출, DB는 marketing_consent 로 정직 저장
          consentSource: 'signup',
          website,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '가입에 실패했습니다.');

      // GA4: 동의자/미동의자 세그먼트·동의율 추적 기준점 (window.gtag 있을 때만)
      if (window.gtag) {
        gtag('event', 'signup_consent', {
          marketing_agree: agreeInfo.checked,
          consent_source: 'signup',
        });
      }

      // 가입 성공 → 바로 로그인시켜 마이페이지로 (리다이렉트/자동로그인 동작은 그대로)
      setStatus('가입 완료! 로그인 중…', 'ok');
      try {
        const c = await fetch(API + '/api/config').then(r => r.json());
        const sb = createClient(c.supabaseUrl, c.supabaseAnonKey);
        const { error } = await sb.auth.signInWithPassword({ email, password: pw });
        if (error) throw error;
        location.href = 'mypage.html';
      } catch (_) {
        // 자동 로그인이 막히면 로그인 화면으로 안내
        setStatus('가입이 완료되었습니다. 로그인 화면으로 이동합니다…', 'ok');
        setTimeout(() => { location.href = 'mypage.html'; }, 1200);
      }
    } catch (err) {
      setStatus(err.message || '가입에 실패했습니다.', 'err');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
